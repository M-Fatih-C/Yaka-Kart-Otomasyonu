name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . build
      - run: python -m build
      - run: python -c "import medar_yakakart; print(medar_yakakart.__file__)"
      - run: python -m compileall -q src scripts
